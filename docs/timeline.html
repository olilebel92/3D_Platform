<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HackNSlash — Development Timeline</title>
  <style>
    :root {
      --bg:#0b0b14; --card:#1a1a2e; --border:#2a2a45;
      --gold:#c9a84c; --gold-dim:#8a6f2e;
      --text:#dde1f0; --muted:#7a7a9a;
      --green:#3dba6e; --orange:#e8920a; --grey:#3a3a5a;
      --blue:#4488ff; --modal-bg:rgba(5,5,15,0.92);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;}

    /* ─── Header ─── */
    header{background:linear-gradient(180deg,#0d0d1e 0%,var(--bg) 100%);border-bottom:1px solid var(--border);padding:28px 60px 22px;position:relative;overflow:hidden;flex-shrink:0;}
    header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -20%,rgba(201,168,76,.07) 0%,transparent 70%);pointer-events:none;}
    .header-inner{position:relative;max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
    .header-left h1{font-size:2rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 30px rgba(201,168,76,.25);}
    .header-left p{margin-top:5px;color:var(--muted);font-size:.85rem;letter-spacing:.03em;}
    .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,.08);border:1px solid var(--gold-dim);color:var(--gold);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 16px;border-radius:8px;text-decoration:none;transition:background .15s,border-color .15s;}
    .back-link:hover{background:rgba(201,168,76,.15);border-color:var(--gold);}
    .status-pill{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:20px;background:rgba(232,146,10,.12);color:var(--orange);border:1px solid rgba(232,146,10,.3);}

    /* ─── Main ─── */
    main{flex:1;display:flex;flex-direction:column;padding:36px 0 0;}

    /* ─── Timeline ─── */
    .tl-scroll{overflow-x:auto;overflow-y:hidden;cursor:grab;-webkit-overflow-scrolling:touch;user-select:none;flex:1;}
    .tl-scroll.tl-dragging{cursor:grabbing;}
    .tl-inner{position:relative;}

    .tl-q-divider{position:absolute;top:0;width:1px;background:rgba(42,42,69,.5);}
    .tl-q-label{position:absolute;font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center;transform:translateX(-50%);white-space:nowrap;font-weight:600;}

    .tl-rail-bg  {position:absolute;border-radius:3px;background:var(--border);}
    .tl-rail-fill{position:absolute;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--gold));}
    .tl-rail-dot {position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:var(--gold);box-shadow:0 0 12px rgba(201,168,76,.6);z-index:5;}

    .tl-stem{position:absolute;width:2px;transform:translateX(-50%);}
    .tl-stem.ts-done  {background:linear-gradient(to bottom,rgba(61,186,110,.5),rgba(61,186,110,.15));}
    .tl-stem.ts-active{background:linear-gradient(to bottom,rgba(232,146,10,.6),rgba(232,146,10,.15));}
    .tl-stem.ts-plain {background:linear-gradient(to bottom,var(--border),rgba(42,42,69,.3));}

    .tl-node{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s;z-index:4;box-sizing:border-box;}
    .tl-node:hover{transform:translate(-50%,-50%) scale(1.4);z-index:6;}
    .tl-node.tn-completed{background:var(--green);border:2px solid rgba(255,255,255,.2);box-shadow:0 0 10px rgba(61,186,110,.25);}
    .tl-node.tn-active   {background:var(--orange);border:2px solid rgba(255,255,255,.25);animation:tnpulse 1.8s ease-in-out infinite;}
    .tl-node.tn-planned  {background:#1a1a2e;border:2px solid #3a3a60;}
    .tl-node.tn-target   {background:var(--gold);border:2px solid rgba(255,255,255,.3);box-shadow:0 0 14px rgba(201,168,76,.35);}
    .tl-node.tn-future   {background:#0c1830;border:2px solid #2255aa;}
    @keyframes tnpulse{0%,100%{box-shadow:0 0 0 0 rgba(232,146,10,.55);}60%{box-shadow:0 0 0 12px rgba(232,146,10,0);}}

    .tl-nlabel{position:absolute;text-align:center;pointer-events:none;transform:translateX(-50%);z-index:2;}
    .tl-nlabel .tnl-ver  {font-size:.68rem;font-weight:800;color:var(--gold);letter-spacing:.04em;white-space:nowrap;line-height:1.4;}
    .tl-nlabel .tnl-title{font-size:.57rem;color:var(--muted);line-height:1.35;white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis;}

    .tl-endpoint{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:3;}
    .tl-ep-dot  {width:28px;height:28px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;}
    .tl-ep-dot.epd-idea  {background:rgba(201,168,76,.08);border:2px dashed var(--gold-dim);}
    .tl-ep-dot.epd-launch{background:rgba(68,136,255,.08);border:2px solid #2255aa;}
    .tl-ep-inner{font-size:.65rem;font-weight:700;}
    .tl-ep-inner.ei-idea  {color:var(--gold-dim);}
    .tl-ep-inner.ei-launch{color:var(--blue);}
    .tl-ep-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;margin-top:6px;white-space:nowrap;line-height:1.5;}
    .tl-ep-label.epl-idea  {color:var(--gold-dim);}
    .tl-ep-label.epl-launch{color:var(--blue);}

    /* ─── Legend ─── */
    .tl-legend{display:flex;gap:22px;flex-wrap:wrap;padding:22px 60px 32px;justify-content:center;flex-shrink:0;}
    .tl-leg{display:flex;align-items:center;gap:7px;font-size:.67rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
    .tl-leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
    .tl-leg-dot.ld-c{background:var(--green);}
    .tl-leg-dot.ld-a{background:var(--orange);}
    .tl-leg-dot.ld-p{background:#1a1a2e;border:1px solid #3a3a60;}
    .tl-leg-dot.ld-t{background:var(--gold);}
    .tl-leg-dot.ld-f{background:#0c1830;border:1px solid #2255aa;}

    /* ─── Modal ─── */
    .modal-overlay{position:fixed;inset:0;background:var(--modal-bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px);}
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;transform:translateY(16px);transition:transform .2s;}
    .modal-overlay.open .modal{transform:translateY(0);}
    .modal-header{padding:28px 28px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);border-radius:16px 16px 0 0;z-index:1;}
    .modal-top{display:flex;justify-content:space-between;align-items:flex-start;}
    .modal-version{font-size:2rem;font-weight:800;color:var(--gold);}
    .modal-close{background:none;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s;}
    .modal-close:hover{color:var(--text);border-color:var(--gold-dim);}
    .modal-title{font-size:1.2rem;font-weight:700;margin:6px 0 4px;}
    .modal-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;}
    .modal-date{font-size:.78rem;color:var(--muted);}
    .modal-body{padding:24px 28px 28px;}
    .modal-section-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;margin-top:22px;}
    .modal-section-title:first-child{margin-top:0;}
    .modal-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
    .modal-list li{font-size:.88rem;color:var(--text);padding:8px 12px 8px 24px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;position:relative;line-height:1.5;}
    .modal-list li::before{content:'→';position:absolute;left:8px;color:var(--gold-dim);font-size:.8rem;}
    .modal-note{margin-top:18px;padding:12px 16px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:8px;font-size:.8rem;color:#b09060;line-height:1.6;}
    .status-badge{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:20px;white-space:nowrap;}
    .badge-completed{background:rgba(61,186,110,.15);color:var(--green);border:1px solid rgba(61,186,110,.3);}
    .badge-active   {background:rgba(232,146,10,.15);color:var(--orange);border:1px solid rgba(232,146,10,.3);}
    .badge-planned  {background:rgba(58,58,90,.5);color:var(--muted);border:1px solid var(--border);}
    .badge-target   {background:rgba(201,168,76,.15);color:var(--gold);border:1px solid var(--gold-dim);}
    .badge-future   {background:rgba(68,136,255,.15);color:var(--blue);border:1px solid #2255aa;}

    ::-webkit-scrollbar{height:4px;width:6px;}
    ::-webkit-scrollbar-track{background:var(--bg);}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <h1>HackNSlash</h1>
      <p>Development Timeline &nbsp;·&nbsp; Q1 2026 — V2.0</p>
    </div>
    <div class="header-right">
      <a href="roadmap.html" class="back-link">&#8592; Roadmap</a>
      <span class="status-pill" id="currentStatus">Loading...</span>
    </div>
  </div>
</header>

<main>
  <div class="tl-scroll" id="tlScroll">
    <div class="tl-inner" id="tlInner"></div>
  </div>
  <div class="tl-legend">
    <span class="tl-leg"><span class="tl-leg-dot ld-c"></span>Completed</span>
    <span class="tl-leg"><span class="tl-leg-dot ld-a"></span>In Progress</span>
    <span class="tl-leg"><span class="tl-leg-dot ld-p"></span>Planned</span>
    <span class="tl-leg"><span class="tl-leg-dot ld-t"></span>V1.0 Target</span>
    <span class="tl-leg"><span class="tl-leg-dot ld-f"></span>Post-V1.0</span>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-top">
        <div><div class="modal-version" id="mVersion"></div><div class="modal-title" id="mTitle"></div></div>
        <button class="modal-close" onclick="closeModalDirect()">x</button>
      </div>
      <div class="modal-meta"><span class="status-badge" id="mBadge"></span><span class="modal-date" id="mDate"></span></div>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  DATA
// ─────────────────────────────────────────────────────────────────────────────

const BADGE_CLASS = {completed:"badge-completed",active:"badge-active",planned:"badge-planned",target:"badge-target",future:"badge-future"};
const BADGE_LABEL = {completed:"Completed",active:"In Progress",planned:"Planned",target:"V1.0 Target",future:"Post-V1.0"};

// ─────────────────────────────────────────────────────────────────────────────
//  LAYOUT CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const TL_QUARTERS = [
  "Q1 2026","Q2 2026","Q3 2026","Q4 2026",
  "Q1 2027","Q2 2027","Q3 2027","Q4 2027",
  "Q1 2028","Q2 2028"
];
const TL_QW  = 340;   // px per quarter
const TL_LP  = 160;   // left pad  — idea endpoint
const TL_RP  = 160;   // right pad — launch endpoint
const TL_H   = 520;   // total height
const TL_RY  = 260;   // rail y
const TL_AY  = 92;    // above-node y
const TL_BY  = 428;   // below-node y
const TL_TOT = TL_LP + TL_QUARTERS.length * TL_QW + TL_RP;

// ─────────────────────────────────────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  const inner = document.getElementById("tlInner");
  inner.style.width  = TL_TOT + "px";
  inner.style.height = TL_H   + "px";

  // ── group by quarter ──
  const byQ = {};
  TL_QUARTERS.forEach(q => byQ[q] = []);
  VERSIONS.forEach(v => { if (byQ[v.quarter]) byQ[v.quarter].push(v); });

  // ── assign x / y alternating above-below ──
  const pos = {};
  let alt = 0;
  TL_QUARTERS.forEach(q => {
    const arr = byQ[q];
    const n   = arr.length;
    const cx  = TL_LP + TL_QUARTERS.indexOf(q) * TL_QW + TL_QW / 2;
    arr.forEach((v, i) => {
      const spread = n === 1 ? 0 : ((i / (n - 1)) - 0.5) * Math.min(TL_QW * 0.72, n * 60);
      pos[v.version] = { x: cx + spread, y: alt % 2 === 0 ? TL_AY : TL_BY, above: alt % 2 === 0 };
      alt++;
    });
  });

  // ── furthest active/completed x for fill ──
  let fillX = TL_LP;
  VERSIONS.forEach(v => {
    if ((v.status === "completed" || v.status === "active") && pos[v.version])
      fillX = Math.max(fillX, pos[v.version].x);
  });

  let html = "";

  // ── quarter dividers + labels ──
  TL_QUARTERS.forEach((q, qi) => {
    const x     = TL_LP + qi * TL_QW;
    const label = q.replace("2026","'26").replace("2027","'27").replace("2028","'28");
    if (qi > 0)
      html += `<div class="tl-q-divider" style="left:${x}px;height:${TL_H}px;"></div>`;
    html += `<div class="tl-q-label" style="left:${x + TL_QW / 2}px;top:${TL_RY - 30}px;">${label}</div>`;
  });

  // ── rail background ──
  const railL = TL_LP, railW = TL_TOT - TL_LP - TL_RP;
  html += `<div class="tl-rail-bg" style="left:${railL}px;top:${TL_RY - 1}px;width:${railW}px;height:4px;"></div>`;

  // ── rail fill (progress) ──
  if (fillX > TL_LP)
    html += `<div class="tl-rail-fill" style="left:${railL}px;top:${TL_RY - 1}px;width:${fillX - railL}px;height:4px;"></div>`;

  // ── active position dot on rail ──
  const activeV = VERSIONS.find(v => v.status === "active");
  if (activeV && pos[activeV.version])
    html += `<div class="tl-rail-dot" style="left:${pos[activeV.version].x}px;top:${TL_RY + 1}px;"></div>`;

  // ── idea endpoint ──
  html += `
    <div class="tl-endpoint" style="left:${TL_LP - 72}px;top:${TL_RY}px;">
      <div class="tl-ep-dot epd-idea"><span class="tl-ep-inner ei-idea">?</span></div>
      <div class="tl-ep-label epl-idea">Idea<br>Q1 '26</div>
    </div>`;

  // ── launch endpoint ──
  html += `
    <div class="tl-endpoint" style="left:${TL_TOT - TL_RP + 72}px;top:${TL_RY}px;">
      <div class="tl-ep-dot epd-launch"><span class="tl-ep-inner ei-launch">V2</span></div>
      <div class="tl-ep-label epl-launch">Launch<br>Q2 '28</div>
    </div>`;

  // ── stems, nodes, labels ──
  VERSIONS.forEach((v, vi) => {
    const p = pos[v.version];
    if (!p) return;

    const isBig   = v.status === "target" || v.version === "V2.0";
    const sz      = isBig ? 26 : 18;
    const stemCls = v.status === "completed" ? "tl-stem ts-done"
                  : v.status === "active"    ? "tl-stem ts-active"
                  :                            "tl-stem ts-plain";

    // stem
    const stemTop = p.above ? p.y      : TL_RY + 2;
    const stemH   = p.above ? TL_RY - 2 - p.y : p.y - TL_RY - 2;
    html += `<div class="${stemCls}" style="left:${p.x}px;top:${stemTop}px;height:${Math.max(0, stemH)}px;"></div>`;

    // node
    html += `<div class="tl-node tn-${v.status}" style="left:${p.x}px;top:${p.y}px;width:${sz}px;height:${sz}px;" onclick="openModal(${vi})" title="${v.version} — ${v.title}"></div>`;

    // label
    const labelTop = p.above ? p.y - sz / 2 - 40 : p.y + sz / 2 + 8;
    html += `<div class="tl-nlabel" style="left:${p.x}px;top:${labelTop}px;">
      <div class="tnl-ver">${v.version}</div>
      <div class="tnl-title">${v.title}</div>
    </div>`;
  });

  inner.innerHTML = html;

  // ── header status pill ──
  if (activeV) {
    document.getElementById("currentStatus").textContent =
      activeV.version + " — " + activeV.title + " — In Progress";
  }

  // ── auto-scroll to active ──
  requestAnimationFrame(() => {
    if (activeV && pos[activeV.version]) {
      const sc = document.getElementById("tlScroll");
      sc.scrollLeft = Math.max(0, pos[activeV.version].x - sc.clientWidth / 2);
    }
  });

  initDrag();
}

// ─────────────────────────────────────────────────────────────────────────────
//  DRAG TO SCROLL
// ─────────────────────────────────────────────────────────────────────────────
function initDrag() {
  const el = document.getElementById("tlScroll");
  if (!el) return;
  let down = false, sx = 0, sl = 0;
  el.addEventListener("mousedown", e => {
    down = true; sx = e.pageX - el.offsetLeft; sl = el.scrollLeft;
    el.classList.add("tl-dragging");
  });
  window.addEventListener("mouseup",  () => { down = false; el.classList.remove("tl-dragging"); });
  el.addEventListener("mouseleave",   () => { down = false; el.classList.remove("tl-dragging"); });
  el.addEventListener("mousemove", e => {
    if (!down) return;
    e.preventDefault();
    el.scrollLeft = sl - (e.pageX - el.offsetLeft - sx) * 1.4;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────────────────────────────────────
function openModal(i) {
  const v = VERSIONS[i];
  document.getElementById("mVersion").textContent = v.version;
  document.getElementById("mTitle").textContent   = v.title;
  document.getElementById("mDate").textContent    = v.date;
  const badge = document.getElementById("mBadge");
  badge.className   = "status-badge " + BADGE_CLASS[v.status];
  badge.textContent = BADGE_LABEL[v.status];
  const details = v.details.map(d => `<li>${d}</li>`).join("");
  const note    = v.note ? `<div class="modal-note">${v.note}</div>` : "";
  document.getElementById("mBody").innerHTML = `
    <div class="modal-section-title">What's in this version</div>
    <ul class="modal-list">${details}</ul>${note}`;
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal(e) {
  if (e.target === document.getElementById("modalOverlay"))
    document.getElementById("modalOverlay").classList.remove("open");
}

function closeModalDirect() {
  document.getElementById("modalOverlay").classList.remove("open");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("modalOverlay").classList.remove("open");
});

render();
</script>
